[project]
name = "flood-response-coordinator"
version = "0.1.0"
description = "Multi-agent flood response coordinator with human-in-the-loop approval — Phase 1 data layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.7",
    "rasterio>=1.3",
    "shapely>=2.0",
    "typer>=0.12",
    "rich>=13.7",
    "langgraph>=1.2.11",
    "langchain-anthropic>=1.5.6",
    "langchain-core>=1.5.4",
    "mcp[cli]>=2.0.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "sse-starlette>=3.4.8",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real public APIs over the network (opt in with `pytest -m live`)",
]
# Live tests are opt-in so offline/CI runs stay green.
addopts = "-m 'not live'"
